# Fly.io config. NOT deployed by this repo — run `fly launch --no-deploy` / `fly deploy` yourself.
# Rooms live in server memory, so run exactly ONE machine (see README → Scaling).
app = "pitchside-change-me"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  FOOTBALL_PROVIDER = "sample"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # keep the machine (and its rooms) alive
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

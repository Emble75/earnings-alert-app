[project]
name = "arbitrage-backend"
version = "1.0.0"
description = "Amazon -> eBay Sell-First arbitrage platform backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
